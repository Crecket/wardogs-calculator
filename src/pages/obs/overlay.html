<!-- OBS OVERLAY -->
<div class="obs-overlay" data-corner="bl" data-panel="full" hidden id="obsOverlay">
<div class="obs-readout" id="obsReadout">
<div class="obs-gun" id="obsGun"></div>
<div class="obs-metrics">
<div class="obs-metric obs-metric-mil">
<span class="obs-metric-label" data-i18n="mil">MIL</span>
<strong class="obs-metric-value" id="obsMil">—</strong>
<span class="obs-metric-sub" id="obsMilArc"></span>
</div>
<div class="obs-metric obs-metric-azimuth">
<span class="obs-metric-label" data-i18n="azimuth">AZIMUTH</span>
<strong class="obs-metric-value" id="obsAzimuth">—</strong>
</div>
<div class="obs-metric obs-metric-range">
<span class="obs-metric-label" data-i18n="distance">Distance</span>
<strong class="obs-metric-value" id="obsRange">—</strong>
<span class="obs-metric-sub" id="obsRangeStatus"></span>
</div>
</div>
<div class="obs-flight" hidden id="obsFlight">
<span class="obs-flight-label" data-i18n="flightTime">Time of flight</span>
<span class="obs-flight-values" id="obsFlightValues"></span>
</div>
<div class="obs-terrain-note" hidden id="obsTerrainNote"></div>
</div>
<div class="obs-status" hidden id="obsStatus"></div>
</div>
